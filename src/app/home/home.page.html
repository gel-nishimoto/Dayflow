<ion-content [fullscreen]="true">
  <div class="page">
    <header class="header">
      <div class="brand">
        <span class="logo"><ion-icon name="checkmark-circle"></ion-icon></span>
        <span class="app-name">Dayflow</span>
      </div>
      <button class="bell" type="button" aria-label="Notifications" (click)="openNotifications()">
        <ion-icon name="notifications-outline"></ion-icon>
        @if (store.unreadCount() > 0) {
          <span class="dot">{{ store.unreadCount() }}</span>
        }
      </button>
    </header>

    <section class="welcome">
      <p class="date">{{ today | date: 'EEEE, MMMM d' }}</p>
      <h1>{{ greeting }}, Angel!</h1>
    </section>

    <app-progress-card [done]="doneCount()" [total]="todayTasks().length"></app-progress-card>

    <section class="section">
      <div class="section-head">
        <h2>Today's Tasks</h2>
        <button class="see-all" type="button" (click)="seeAll()">See All</button>
      </div>

      <div class="list">
        @for (task of visibleTasks(); track task.id) {
          <app-task-item
            [task]="task"
            (toggle)="actions.toggle($event)"
            (openTask)="actions.openDetail($event)"
          ></app-task-item>
        } @empty {
          <div class="empty">
            <ion-icon name="sunny-outline"></ion-icon>
            <p>Nothing planned for today.</p>
          </div>
        }
      </div>
    </section>
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button aria-label="Add task" (click)="actions.openForm()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
