<ion-content>
  <div class="sheet">
    <div class="sheet-top">
      <div>
        <h2>{{ replaceIndex !== undefined ? 'Replace Photo' : 'Add Attachment' }}</h2>
        <p class="capacity">{{ capacityLabel }}</p>
      </div>
      <button type="button" class="icon-close" aria-label="Close" (click)="cancel()">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>

    <div class="options">
      <!-- 1. Take Photo -->
      <button type="button" class="opt-btn" [disabled]="!canAddPhoto || loading()" (click)="takePhoto()">
        <span class="opt-icon"><ion-icon name="camera-outline"></ion-icon></span>
        <span class="opt-text">
          <span class="opt-title">Take Photo</span>
          <span class="opt-sub">Open camera to capture a photo</span>
        </span>
      </button>

      <!-- 2. Choose From Gallery -->
      <button type="button" class="opt-btn" [disabled]="!canAddPhoto || loading()" (click)="chooseFromGallery()">
        <span class="opt-icon"><ion-icon name="images-outline"></ion-icon></span>
        <span class="opt-text">
          <span class="opt-title">Choose From Gallery</span>
          <span class="opt-sub">Choose photos from your gallery ({{ 5 - currentAttachmentCount }} left)</span>
        </span>
      </button>

      <!-- 3. Record Video -->
      @if (replaceIndex === undefined) {
        <button type="button" class="opt-btn" [disabled]="!canAddVideo || loading()" (click)="recordVideo()">
          <span class="opt-icon video"><ion-icon name="videocam-outline"></ion-icon></span>
          <span class="opt-text">
            <span class="opt-title">Record Video</span>
            <span class="opt-sub">Record a video clip using device camera</span>
          </span>
        </button>
      }
    </div>

    <div class="rule-banner">
      <ion-icon name="information-circle-outline"></ion-icon>
      <span>You can select or record up to 5 attachments overall (photos or videos).</span>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-ghost" (click)="cancel()">Cancel</button>
    </div>
  </div>
</ion-content>
